<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#f5d068"/><stop offset=".3" stop-color="#c99527"/><stop offset=".7" stop-color="#7d4d0b"/><stop offset="1" stop-color="#342105"/>
  </linearGradient>
  <radialGradient id="spot" cx=".24" cy=".14" r=".86">
    <stop stop-color="#fff4bf" stop-opacity=".55"/><stop offset=".32" stop-color="#fff" stop-opacity=".07"/><stop offset="1" stop-color="#000" stop-opacity=".16"/>
  </radialGradient>
  <linearGradient id="rod" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#684007"/><stop offset=".09" stop-color="#e4b545"/><stop offset=".20" stop-color="#f7d36f"/>
    <stop offset=".34" stop-color="#a96b0d"/><stop offset=".49" stop-color="#f6cf5c"/><stop offset=".66" stop-color="#8e5609"/>
    <stop offset=".81" stop-color="#e1ad37"/><stop offset="1" stop-color="#5a3506"/>
