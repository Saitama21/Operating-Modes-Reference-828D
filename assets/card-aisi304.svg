    <feOffset dy="30" result="o"/>
    <feComponentTransfer in="o"><feFuncA type="linear" slope=".38"/></feComponentTransfer>
    <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
