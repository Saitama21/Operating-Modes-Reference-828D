<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#ffef67"/><stop offset=".34" stop-color="#f7cb1e"/>
    <stop offset=".72" stop-color="#d99a05"/><stop offset="1" stop-color="#8e5a00"/>
  </linearGradient>
  <radialGradient id="sun" cx=".18" cy=".12" r=".75">
    <stop stop-color="#fff6b2" stop-opacity=".72"/><stop offset=".36" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#000" stop-opacity=".14"/>
  </radialGradient>
  <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
    <stop stop-color="#3d444b"/><stop offset=".08" stop-color="#d6dadd"/>
    <stop offset=".18" stop-color="#ffffff"/><stop offset=".30" stop-color="#8f979e"/>
    <stop offset=".42" stop-color="#edf0f2"/><stop offset=".56" stop-color="#5f666d"/>
    <stop offset=".70" stop-color="#fbfcfd"/><stop offset=".84" stop-color="#8b9298"/>
