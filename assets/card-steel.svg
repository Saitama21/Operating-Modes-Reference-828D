<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1100">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#394047"/><stop offset=".46" stop-color="#1c2228"/><stop offset="1" stop-color="#080c10"/>
  </linearGradient>
  <radialGradient id="spot" cx=".66" cy=".22" r=".72">
    <stop stop-color="#c5ccd2" stop-opacity=".17"/><stop offset=".45" stop-color="#66717b" stop-opacity=".05"/><stop offset="1" stop-color="#000" stop-opacity=".18"/>
  </radialGradient>
  <linearGradient id="top" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#eef1f3"/><stop offset=".16" stop-color="#a9b0b6"/><stop offset=".36" stop-color="#cdd2d6"/>
    <stop offset=".62" stop-color="#737b83"/><stop offset=".84" stop-color="#a7aeb4"/><stop offset="1" stop-color="#424950"/>
  </linearGradient>
  <linearGradient id="front" x1="0" y1="0" x2="1" y2="1">
